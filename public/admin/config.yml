locale: "zh_Hans"

# 本地开发：启用本地 git 仓库模式（需要同时运行 npx decap-server）
local_backend: true

backend:
  name: github
  repo: bigcaole/my-blog
  branch: main

  # 线上 GitHub 登录需要 OAuth 服务端（自托管 OAuth Proxy）
  #
  # 这里采用同域反代方案：
  # - 站点域名：https://你的域名
  # - OpenResty 反代：/api/auth -> http://127.0.0.1:4000
  #
  # 因为 config.yml 无法直接读取 src/config/site.ts，这里先留占位：
  base_url: "https://YOUR_DOMAIN/api/auth"
  auth_endpoint: "auth"

# 站点 URL（可选；建议填写你的线上域名，便于 CMS 生成更准确的链接）
site_url: "https://YOUR_DOMAIN"

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: editorial_workflow

collections:
  - name: "blog"
    label: "文章"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "摘要", name: "description", widget: "string" }
      - { label: "标签", name: "tags", widget: "list", field: { label: "标签", name: "tag", widget: "string" } }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "精选", name: "featured", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "settings"
    label: "设置"
    files:
      - label: "站点设置"
        name: "site"
        file: "src/content/settings/site.json"
        format: "json"
        fields:
          - { label: "站点名称", name: "siteName", widget: "string", required: false }
          - { label: "Slogan", name: "slogan", widget: "string", required: false }
          - { label: "站点描述", name: "description", widget: "text", required: false }
          - label: "导航"
            name: "nav"
            widget: "list"
            required: false
            fields:
              - { label: "名称", name: "label", widget: "string" }
              - { label: "链接", name: "href", widget: "string" }
          - label: "社交"
            name: "social"
            widget: "object"
            required: false
            fields:
              - { label: "GitHub", name: "github", widget: "string", required: false }
              - { label: "Telegram", name: "telegram", widget: "string", required: false }
              - { label: "X(Twitter)", name: "x", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
          - label: "工具箱"
            name: "tools"
            widget: "list"
            required: false
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string" }
              - { label: "描述", name: "description", widget: "string", required: false }
              - { label: "状态", name: "status", widget: "select", options: ["live", "coming-soon"], default: "live" }
              - { label: "图标 Key", name: "iconKey", widget: "string", required: false }
          - label: "SEO"
            name: "seo"
            widget: "object"
            required: false
            fields:
              - { label: "Twitter Handle", name: "twitterHandle", widget: "string", required: false }
              - { label: "OG Image", name: "ogImage", widget: "string", required: false }
