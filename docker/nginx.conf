server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Assets: long cache (Astro usually emits hashed files under /_astro/)
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Feeds & crawlers: short cache
  location = /rss.xml {
    add_header Cache-Control "public, max-age=600";
    try_files $uri =404;
  }
  location = /sitemap.xml {
    add_header Cache-Control "public, max-age=600";
    try_files $uri =404;
  }
  location = /robots.txt {
    add_header Cache-Control "public, max-age=600";
    try_files $uri =404;
  }

  # HTML pages: low cache
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/ =404;
  }

  # Friendly 404 (Astro typically outputs /404.html for src/pages/404.astro)
  error_page 404 /404.html;
  location = /404.html {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    internal;
  }
}

