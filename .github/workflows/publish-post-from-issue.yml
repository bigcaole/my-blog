name: Publish Post From Issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-post-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    # Only run on label "publish", or manual dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.label && github.event.label.name == 'publish') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Create markdown file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // For workflow_dispatch, we cannot reliably infer issue info without inputs.
            // In that case, we just fail with a clear message.
            if (context.eventName === 'workflow_dispatch') {
              core.setFailed('workflow_dispatch 暂未实现（需要指定 issue number）。请在 Issue 上添加 publish 标签触发。');
              return;
            }

            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const title = (issue.title || '').trim();
            const body = (issue.body || '').trim();
            const createdAt = issue.created_at ? new Date(issue.created_at) : new Date();
            const yyyy = createdAt.getUTCFullYear();
            const mm = String(createdAt.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(createdAt.getUTCDate()).padStart(2, '0');
            const dateStr = `${yyyy}-${mm}-${dd}`;

            function slugify(input) {
              const s = String(input || '')
                .toLowerCase()
                .replace(/['"]/g, '')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
              return s;
            }

            const slug = slugify(title) || `post-${issueNumber}`;
            const filename = `${dateStr}-${slug}-${issueNumber}.md`;
            const relDir = path.join('src', 'content', 'blog');
            const relPath = path.join(relDir, filename);

            if (!title) {
              core.setFailed('Issue 标题为空：请用 Issue 标题作为文章标题。');
              return;
            }
            if (!body) {
              core.setFailed('Issue 正文为空：请在正文里写文章内容（Markdown）。');
              return;
            }

            const hasFrontmatter = body.startsWith('---\n') && body.includes('\n---');

            // Optional: parse tags/description from a simple convention when frontmatter is absent
            // Examples:
            // - Tags: A, B
            // - 标签：A, B
            // - Description: ...
            // - 摘要：...
            function pickLine(prefixes) {
              const lines = body.split('\n').map(l => l.trim());
              for (const line of lines) {
                for (const p of prefixes) {
                  if (line.toLowerCase().startsWith(p.toLowerCase())) return line.slice(p.length).trim();
                }
              }
              return '';
            }

            const tagsLine = pickLine(['Tags:', '标签：', '标签:', 'tags:']);
            const descLine = pickLine(['Description:', '摘要：', '摘要:', 'description:']);
            const tags = tagsLine
              ? tagsLine.split(/[,，]/).map(s => s.trim()).filter(Boolean)
              : [];

            const description = (descLine || body.split('\n').map(l => l.trim()).find(Boolean) || '').slice(0, 140);

            const frontmatter = `---\n` +
              `title: ${JSON.stringify(title)}\n` +
              `date: ${dateStr}\n` +
              `tags: ${JSON.stringify(tags)}\n` +
              `description: ${JSON.stringify(description)}\n` +
              `draft: false\n` +
              `---\n\n`;

            const content = hasFrontmatter ? `${body}\n` : `${frontmatter}${body}\n`;

            fs.mkdirSync(relDir, { recursive: true });
            if (fs.existsSync(relPath)) {
              core.setFailed(`目标文件已存在：${relPath}`);
              return;
            }
            fs.writeFileSync(relPath, content, 'utf8');

            core.notice(`Created: ${relPath}`);
            core.setOutput('post_path', relPath.replace(/\\/g, '/'));

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog
          git commit -m "post: publish from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;
            const title = issue.title;

            const body = [
              `已发布文章：**${title}**`,
              ``,
              `- 源文件已写入：\`src/content/blog/\`（本次由工作流自动提交）`,
              `- 接下来会触发构建/部署流程（例如 Docker 镜像构建与服务器更新）`,
            ].join('\n');

            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            await github.rest.issues.update({ owner, repo, issue_number, state: 'closed' });

